"/02_example.html" = "example.html"
"/03_big_picture.html" = "big_picture.html"
"/04_modelling.html" = "modelling.html"
"/04B_advanced_modelling.html" = "advanced_modelling.html"
"/05_parameters.html" = "parameters.html"
"/06_coding_patterns.html" = "coding_patterns.html"
"/07_under_the_hood.html" = "under_the_hood.html"
"/08_benchmarking.html" = "benchmarking.html"
"/09_lns.html" = "lns.html"
