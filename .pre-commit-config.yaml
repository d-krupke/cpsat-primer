ci:
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Manuscript PDFs and cover art are intentionally shipped uncompressed.
        exclude: "^manuscripts/.*\\.(pdf|png)$"
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: "README.md"
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: "^tests/packages/|(^|/)_"
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        exclude: "^tests"

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.4
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.99
    hooks:
      # Type-checks the paths configured in pyproject.toml ([tool.ty.src]).
      # --isolated: do not create a uv.lock or .venv in the repository.
      - id: ty
        args: [--isolated]

  # - repo: https://github.com/codespell-project/codespell
  #   rev: v2.2.4
  #   hooks:
  #     - id: codespell
  #       exclude: ^(LICENSE$|.*\.ipynb$)

  # Won't run on my new macbook
  #  - repo: https://github.com/shellcheck-py/shellcheck-py
  #    rev: v0.9.0.2
  #    hooks:
  #      - id: shellcheck

  # Kept at Prettier 3.1: later releases line-wrap inside inline $...$ math.
  # This mirror is archived; rbubley/mirrors-prettier continues it.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]
        # Pinned: nodeenv otherwise picks the newest Node release and cannot
        # parse alpha versions such as 27.0.0-alpha.
        language_version: 24.11.1
        # README.md and chapters/search_core.md are generated (.scripts/build.py /
        # the Search Core LaTeX pipeline); leave their formatting authoritative.
        exclude: "README.md|chapters/search_core.md"

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml
      - id: disallow-expressions
        name: Disallow expressions
        language: pygrep
        entry: tool\.cmake
        exclude: .pre-commit-config.yaml
      - id: build-readme
        name: Build the README.md from the subfiles
        entry: python3 ./.scripts/build.py
        language: system
        always_run: true
        files: "README.md"
        verbose: true
